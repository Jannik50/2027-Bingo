<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2027 Bingo Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="page">
    <div class="title">2027 BINGO CARD</div>

    <section class="card">
        <div class="grid" id="bingoGrid" aria-label="2027 Bingo Card"></div>
    </section>

    <div class="bingo-message" id="bingoMessage" aria-live="polite">
        🎉 BINGO! 🎉
    </div>

    <div class="instructions">
        Click a square to cross it out. Click it again to undo.
    </div>

    <button class="reset" id="resetButton" type="button">
        Reset Card
    </button>
</main>

<script src="script.js"></script>
</body>
</html>
